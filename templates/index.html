<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />
    <title>OptiEcoRoute</title>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-white via-fuchsia-100 to-purple-200 text-slate-800"
  >
    <main class="flex min-h-screen items-center justify-center px-6">
      <section class="w-full max-w-4xl text-center">
        <h1
          class="text-6xl font-bold tracking-tight text-slate-800 md:text-7xl"
        >
          <span class="text-amber-600">Opti</span
          ><span class="text-green-400">Eco</span>Route<span
            class="inline-block animate-bounce"
            >&#127811;</span
          >
        </h1>
        <p
          class="text-xs m-4 font-bold tracking-tight text-slate-800 md:text-lg"
        >
          Find the
          <span class="text-purple-600 animate-pulse">best route!</span>
        </p>
        <form
          action="/result"
          method="POST"
          class="m-6 flex items-center gap-2 rounded-full border border-white bg-white/95 p-2.5 shadow-[0_18px_50px_rgba(88,28,135,0.18)] backdrop-blur"
        >
          <input
            name="source"
            class="h-12 w-full rounded-full bg-purple-50 px-5 text-xl text-purple-950 outline-none transition duration-200 placeholder:text-purple-400 focus:bg-white focus:ring-2 focus:ring-purple-300"
            type="text"
            placeholder="Start your journey"
          />
          <input
            name="destination"
            class="h-12 w-full rounded-full bg-purple-50 px-5 text-xl text-purple-950 outline-none transition duration-200 placeholder:text-purple-400 focus:bg-white focus:ring-2 focus:ring-purple-300"
            type="text"
            placeholder="Destination"
          />
          <button
            class="group relative flex h-12 w-12 shrink-0 cursor-pointer items-center justify-center rounded-full bg-purple-950 text-white transition-all duration-300 hover:rotate-[360deg] hover:bg-purple-600 active:scale-90"
          >
            <span
              class="text-xl transition-all duration-300 group-hover:scale-0"
            >
              Go
            </span>
            <span
              class="absolute left-1/2 top-1/2 text-2xl opacity-0 transition-all duration-300 -translate-x-1/2 -translate-y-1/2 group-hover:-translate-y-[20px] group-hover:scale-150 group-hover:opacity-100"
            >
              &#8680;
            </span>
          </button>
        </form>
        {% if error %}
        <div
          class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
        >
          <div class="w-80 rounded-2xl bg-white p-6 text-center shadow-xl">
            <div class="mb-3 text-3xl">⚠️</div>
            <h2 class="mb-2 text-lg font-semibold text-gray-800">
              Invalid Input
            </h2>
            <p class="mb-5 text-sm text-gray-600">{{ error }}</p>
            <button
              onclick="this.closest('.fixed').remove()"
              class="rounded-full bg-purple-950 px-6 py-2 text-sm font-medium text-white transition hover:bg-purple-600"
            >
              Okay
            </button>
          </div>
        </div>
        {% endif %}
      </section>
    </main>
  </body>
</html>
